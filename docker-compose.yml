services:
  # 1. Service Database PostgreSQL (Timezone Asia/Jakarta)
  db:
    image: postgres:16-alpine
    container_name: eduportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Rahadyan27}
      POSTGRES_DB: ${DB_NAME:-eduportal_db}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-eduportal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eduportal-network

  # 2. Service Backend Express.js (Timezone Asia/Jakarta)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduportal-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      TZ: Asia/Jakarta
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Rahadyan27}
      DB_NAME: ${DB_NAME:-eduportal_db}
      DB_SSL: ${DB_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-rahasia_eduportal_pro_sekolah_2026_super_safe}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eduportal-network

  # 3. Service Frontend React Vite (Nginx Server di Port 8085)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: eduportal-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - eduportal-network

networks:
  eduportal-network:
    name: eduportal-network
    driver: bridge

volumes:
  pgdata:
  uploads_data:
