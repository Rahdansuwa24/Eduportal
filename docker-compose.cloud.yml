services:
  # 1. Backend Express API (Terhubung langsung ke Cloud Database via SSL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduportal-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:-rahasia_eduportal_pro_sekolah_2026_super_safe}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - eduportal-network

  # 2. Frontend React Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: eduportal-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - eduportal-network

  # 3. Reverse Proxy & Automatic SSL/HTTPS (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: eduportal-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@sekolah.sch.id}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - eduportal-network

networks:
  eduportal-network:
    driver: bridge

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
